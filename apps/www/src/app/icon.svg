<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" role="img" aria-label="Linktich">
  <!-- The public site's favicon, from the App Router's file convention. The
       board variant of src/components/mark.tsx: a 3x3 week on the board green,
       the middle class in chalk yellow. apple-icon.png and favicon.ico are
       rendered from this file and must be re-rendered when it changes.

       Colours are LITERAL (the light-theme pen, on-pen and marker values): a
       favicon renders outside any document carrying the token sheet. -->
  <rect width="64" height="64" rx="14" fill="#1e3a32"/>
  <g fill="#f3f4f0" opacity=".28">
    <rect x="8" y="8" width="14" height="14" rx="4"/>
    <rect x="25" y="8" width="14" height="14" rx="4"/>
    <rect x="42" y="8" width="14" height="14" rx="4"/>
    <rect x="8" y="25" width="14" height="14" rx="4"/>
    <rect x="42" y="25" width="14" height="14" rx="4"/>
    <rect x="8" y="42" width="14" height="14" rx="4"/>
    <rect x="25" y="42" width="14" height="14" rx="4"/>
    <rect x="42" y="42" width="14" height="14" rx="4"/>
  </g>
  <rect x="25" y="25" width="14" height="14" rx="4" fill="#f2e6b8"/>
</svg>
