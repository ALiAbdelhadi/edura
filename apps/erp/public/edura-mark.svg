<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Edura">
  <!-- The Edura mark, engraved.
       ONE geometry, three surfaces: the paths below are the same strings held in
       packages/ui/src/lib/edura-mark.ts, which the student ID card feeds to
       <path d> and the PNG exporter feeds to new Path2D(). If you change a
       coordinate here, change it there.

       The file this replaced was EduConnect-era: a violet-to-indigo gradient on
       a filled tile, plus #00b473 and #ffc6c6 — three hues the Ledger palette
       does not contain, and the one device the direction forbids. It is the open
       book and its spine only; the cap, tassel and stud are shapes at 200px and
       a smudge at the 16px this file actually renders at as a favicon.

       Colours are LITERAL, never CSS custom properties. A favicon, a manifest
       icon and a push-notification badge are all rendered outside any document
       that has the token sheet, so a custom property here would resolve to
       nothing. The embedded media query is what carries dark mode instead.

       DO NOT WRITE A CUSTOM PROPERTY'S NAME IN THIS COMMENT. SVG is parsed as
       XML, where a comment may not contain a double hyphen, and a custom
       property's name begins with one. The line above used to spell two of
       them out, which made this whole file fail to parse: Chrome reported
       "EncodingError: The source image cannot be decoded", the sidebar mark
       rendered as a broken image showing its alt text, and the favicon,
       manifest icons and push badge were all served from the same unparseable
       file. It fetched 200 with the correct content-type the entire time,
       which is why it went unnoticed. -->
  <style>
    .ink { stroke: #201f1d; }
    .gold { stroke: #b68235; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f0eeea; }
      .gold { stroke: #d9a95e; }
    }
  </style>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- The two open pages — outlines, where the original had translucent fills.
         An engraving states an edge; it does not wash an area. -->
    <path class="ink" stroke-width="11" d="M100 52 L54 84 L54 150 L100 122 Z" />
    <path class="ink" stroke-width="11" d="M100 52 L146 84 L146 150 L100 122 Z" />
    <!-- The spine, holding the two halves together. The one gold stroke. -->
    <path class="gold" stroke-width="8" d="M100 52 L100 122" />
  </g>
</svg>
