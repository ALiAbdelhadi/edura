name: Deploy drift

# ============================================================================
# IS MAIN CARRYING CODE PRODUCTION IS NOT SERVING?
#
# On 2026-08-03 main sat eight and a half hours ahead of production and nothing
# said so. CI was red on the DB suites; deploy.yml is gated on a SUCCESSFUL CI
# run, so it correctly refused to ship — and then the day went on. The gate
# worked. The silence is what failed: a refusal nobody hears is indistinguishable
# from a deploy that happened.
#
# This is the sibling of the pending-migration gate. That one asks "would this
# code outrun its database?"; this asks "did the code ever leave the building?".
#
# WHY A SCHEDULE AND NOT A PUSH TRIGGER. Drift is not created by an event, it is
# a state you are left sitting in. The push that fails to deploy is exactly the
# one that cannot report on itself, so the check has to come back later and look.
#
# FAIL LOUDLY, NEVER SKIP QUIETLY — the rule backup.yml and deploy.yml already
# follow. Missing secrets make this run RED with an explanation rather than green
# having done nothing, because a green tick on a check that never ran is the
# whole failure mode being fixed.
# ============================================================================

on:
  schedule:
    # Every 3 hours. Drift is measured in hours, so minute-level resolution buys
    # nothing; the grace window below is what prevents noise, not the interval.
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: main vs production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The script compares against origin/main and reads its commit date,
          # so it needs real history, not a shallow single-commit checkout.
          fetch-depth: 0
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      # No `bun install`: the script imports only node builtins, deliberately,
      # so a broken lockfile or a failing postinstall can never be the reason
      # the drift alarm stops working.
      - name: Prove the decision logic before trusting its verdict
        run: bunx tsx .github/scripts/check-deploy-drift.ts --self-test

      - name: Is production serving main?
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_ERP: ${{ secrets.VERCEL_PROJECT_ID_ERP }}
          VERCEL_PROJECT_ID_WWW: ${{ secrets.VERCEL_PROJECT_ID_WWW }}
          VERCEL_PROJECT_ID_SUPERADMIN: ${{ secrets.VERCEL_PROJECT_ID_SUPERADMIN }}
          # Minutes main may legitimately be ahead — a deploy in flight, or CI
          # still running, is not drift. Raise it if this ever cries wolf during
          # a normal deploy; do not raise it to silence a real backlog.
          DRIFT_GRACE_MINUTES: "90"
        run: bunx tsx .github/scripts/check-deploy-drift.ts
