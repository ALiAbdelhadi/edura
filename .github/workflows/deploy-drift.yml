name: Deploy drift

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: main vs production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Prove the decision logic before trusting its verdict
        run: bunx tsx .github/scripts/check-deploy-drift.ts --self-test

      - name: Is production serving main?
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_ERP: ${{ secrets.VERCEL_PROJECT_ID_ERP }}
          VERCEL_PROJECT_ID_WWW: ${{ secrets.VERCEL_PROJECT_ID_WWW }}
          VERCEL_PROJECT_ID_SUPERADMIN: ${{ secrets.VERCEL_PROJECT_ID_SUPERADMIN }}
          DRIFT_GRACE_MINUTES: "90"
        run: bunx tsx .github/scripts/check-deploy-drift.ts
