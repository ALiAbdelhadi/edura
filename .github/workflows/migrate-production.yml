# ============================================================================
# MIGRATE PRODUCTION — manual, two-step, runs where the credential lives.
#
# Born 2026-08-26: the local .env.production vanished and every value on the
# recreated Vercel projects is marked Sensitive (unpullable), so no machine
# outside GitHub holds a production DB string any more. BACKUP_DIRECT_URL —
# set 2026-08-08 for the nightly dump — is the one surviving production
# credential, and this workflow lets it apply migrations WITHOUT ever leaving
# GitHub's secret store.
#
# Two-step by design, mirroring the pre-flight the 2026-08-20 entries in
# CLAUDE.md demand:
#   1. dispatch with mode=status  → read-only: label guard + pending list
#   2. read the run's output, then dispatch with mode=deploy
#
# The guard step is db-guard.ts: it refuses unless the database REACHED labels
# itself `edura-env:production`, so a mis-set secret fails loudly before any
# DDL runs. `verify-db` runs after deploy; its shape baseline is committed in
# expected-db-shape.json.
# ============================================================================
name: migrate-production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status/census = read-only; deploy = migrations; cleanup = pre-launch residue wipe (MVP blocker #7)"
        required: true
        default: status
        type: choice
        options:
          - status
          - deploy
          - census
          - cleanup
      confirm:
        description: "cleanup only: must be exactly wipe-<N>-users, N from the census run you just read"
        required: false
        type: string

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard — secret must exist
        run: |
          if [ -z "${{ secrets.BACKUP_DIRECT_URL }}" ]; then
            echo "::error::BACKUP_DIRECT_URL is not set — nothing to run with."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # postinstall runs `prisma generate`, which reads these.
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}

      - name: Guard — the reached database must label itself production
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          ADMIN_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: bunx tsx scripts/db-guard.ts production

      - name: Migration status (read-only)
        if: inputs.mode == 'status' || inputs.mode == 'deploy'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        # `migrate status` exits 1 when migrations are pending — that is the
        # expected pre-deploy state, not a failure of this step.
        run: npx prisma migrate status || true

      - name: Migrate deploy
        if: inputs.mode == 'deploy'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Verify shape after deploy
        if: inputs.mode == 'deploy'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          ADMIN_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: bunx tsx scripts/verify-db.ts

      # ---- MVP blocker #7: pre-launch residue wipe -------------------------
      # Two-step like migrations themselves: census (read-only, names every
      # row) → read the output → cleanup with confirm=wipe-<N>-users. The
      # script's own rails re-check the label, the staff set, and the catalog
      # counts inside the same transaction.
      - name: Pre-launch census (read-only)
        if: inputs.mode == 'census'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: bunx tsx scripts/production-cleanup.ts census

      - name: Pre-launch cleanup (residue wipe)
        if: inputs.mode == 'cleanup'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: bunx tsx scripts/production-cleanup.ts cleanup --confirm='${{ inputs.confirm }}'

      - name: Verify shape after cleanup
        if: inputs.mode == 'cleanup'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          ADMIN_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: bunx tsx scripts/verify-db.ts
