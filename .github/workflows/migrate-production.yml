name: migrate-production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status/census = read-only; deploy = migrations; cleanup = pre-launch residue wipe (MVP blocker #7)"
        required: true
        default: status
        type: choice
        options:
          - status
          - deploy
          - census
          - cleanup
      confirm:
        description: "cleanup only: must be exactly wipe-<N>-users, N from the census run you just read"
        required: false
        type: string

concurrency:
  group: migrate-production
  cancel-in-progress: false

# SECURITY_AUDIT.md (2026-09-11) CI-01: the default GITHUB_TOKEN is read-only here.
permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard — secret must exist
        run: |
          if [ -z "${{ secrets.BACKUP_DIRECT_URL }}" ]; then
            echo "::error::BACKUP_DIRECT_URL is not set — nothing to run with."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}

      - name: Guard — the reached database must label itself production
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          ADMIN_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: bunx tsx scripts/db-guard.ts production

      - name: Migration status (read-only)
        if: inputs.mode == 'status' || inputs.mode == 'deploy'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: npx prisma migrate status || true

      - name: Migrate deploy
        if: inputs.mode == 'deploy'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Verify shape after deploy
        if: inputs.mode == 'deploy'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          ADMIN_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: bunx tsx scripts/verify-db.ts

      - name: Pre-launch census (read-only)
        if: inputs.mode == 'census'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: bunx tsx scripts/production-cleanup.ts census

      - name: Pre-launch cleanup (residue wipe)
        if: inputs.mode == 'cleanup'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          CONFIRM_INPUT: ${{ inputs.confirm }} # CI-02
        run: bunx tsx scripts/production-cleanup.ts cleanup --confirm="$CONFIRM_INPUT"

      - name: Verify shape after cleanup
        if: inputs.mode == 'cleanup'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          ADMIN_URL: ${{ secrets.BACKUP_DIRECT_URL }}
        run: bunx tsx scripts/verify-db.ts
