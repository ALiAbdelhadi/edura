name: Scheduled jobs

# ============================================================================
# The scheduler for /api/v1/cron/[job].
#
# WHY THIS EXISTS: the repo has defined scheduled jobs since 2026-07-26 and
# NOTHING invoked them — every one was dead in every environment (see
# docs/reports/cron-jobs-unscheduled.md, an open pre-launch blocker). The
# endpoint was correct, authenticated and tested; it was simply never called.
#
# WHY GITHUB ACTIONS AND NOT VERCEL CRON: Vercel's scheduler issues a GET.
# `/api/v1/cron/[job]` is POST-only on purpose — M7 removed the `GET = POST`
# alias so that a prefetcher, link scanner or crawler can never trigger a
# data-mutating job by following a URL. Adopting Vercel Cron would mean
# re-opening exactly the hole M7 closed. A workflow can POST and send the
# secret in a header, so the door stays shut.
#
# THE SECRET IS THE ONLY AUTHENTICATION. `CRON_SECRET` fails closed in every
# environment: with it unset the endpoint rejects everything, so a misconfigured
# schedule is inert rather than dangerous.
# ============================================================================

on:
  schedule:
    # Times are UTC. Cairo is UTC+2 (UTC+3 on DST) — the offsets below are
    # written for the Cairo hour that matters, not for a tidy UTC number.
    - cron: "0 * * * *" # hourly    — time-sensitive expiries and reminders
    - cron: "30 1 * * *" # daily     03:30/04:30 Cairo, after teaching ends
    - cron: "0 2 * * 0" # Sunday    04:00/05:00 Cairo — the weekly digest
    - cron: "0 3 1 * *" # 1st of the month — statements for the month just past
  workflow_dispatch:
    inputs:
      jobs:
        description: Comma-separated job names to run now
        type: string
        default: weekly-center-digest

concurrency:
  # A slow run must not overlap the next tick: these jobs are idempotent, but
  # two copies racing wastes database time for no benefit.
  group: cron-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  run:
    name: Run due jobs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve which jobs this tick owns
        id: plan
        run: |
          case "${{ github.event.schedule }}" in
            "0 * * * *")  JOBS="expire-payment-intents,data-exports,lesson-reminders" ;;
            "30 1 * * *") JOBS="expire-subscriptions,expire-collaboration-requests,guardian-contact-reminders" ;;
            "0 2 * * 0")  JOBS="weekly-center-digest" ;;
            "0 3 1 * *")  JOBS="month-end-statements" ;;
            *)            JOBS="${{ inputs.jobs }}" ;;
          esac
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"
          echo "This tick runs: $JOBS"

      # A scheduled run that cannot authenticate is a FAILURE, loudly. The
      # alternative — skipping quietly — is how a platform discovers months
      # later that nothing has been running (the same reasoning as backup.yml).
      - name: Require configuration
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ] || [ -z "${{ secrets.CRON_BASE_URL }}" ]; then
            echo "::error::CRON_SECRET and/or CRON_BASE_URL are not set — no scheduled job can run."
            echo "Set both in repo settings → Secrets and variables → Actions."
            echo "  CRON_BASE_URL  e.g. https://app.edura.example  (no trailing slash)"
            echo "  CRON_SECRET    the same value the deployment runs with"
            exit 1
          fi

      - name: POST each job
        env:
          BASE: ${{ secrets.CRON_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
          JOBS: ${{ steps.plan.outputs.jobs }}
        run: |
          set -uo pipefail
          FAILED=0
          IFS=',' read -ra LIST <<< "$JOBS"
          for job in "${LIST[@]}"; do
            job="$(echo "$job" | xargs)"
            [ -z "$job" ] && continue
            # --max-time: a job that hangs must not hold the runner for 20
            # minutes and mask the ones queued behind it.
            code=$(curl -sS -m 300 -o /tmp/out.json -w '%{http_code}' \
              -X POST -H "x-cron-secret: $SECRET" "$BASE/api/v1/cron/$job" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  ok   [$code] $job  $(head -c 300 /tmp/out.json)"
            else
              # One job's failure must not skip the rest of the tick — they are
              # unrelated, and a stuck expiry should not cost the reminders.
              echo "::error::[$code] $job — $(head -c 300 /tmp/out.json)"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED job(s) failed this tick."
            exit 1
          fi
