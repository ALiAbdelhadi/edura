name: Database backup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database to back up
        type: choice
        options: [production, dev]
        default: production

concurrency:
  group: db-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, upload
    if: github.event_name != 'schedule' || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EDURA_ENV: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for a backup configuration
        id: guard
        run: |
          if [ -z "${{ secrets.BACKUP_DIRECT_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BACKUP_DIRECT_URL is not set — skipping. See docs/runbooks/backup-restore.md for the required secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 18 client
        if: steps.guard.outputs.configured == 'true'
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 age
          pg_dump --version

      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.configured == 'true'
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: bun install --frozen-lockfile
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}

      - name: Back up
        if: steps.guard.outputs.configured == 'true'
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'auto' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          BACKUP_ALERT_EMAIL: ${{ secrets.BACKUP_ALERT_EMAIL }}
          MAIL_PROVIDER: smtp
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: bun run db:backup "${EDURA_ENV}"

      - name: Fail if the job was skipped on a SCHEDULED run
        if: steps.guard.outputs.configured != 'true' && github.event_name == 'schedule'
        run: |
          echo "::error::The nightly backup did not run — BACKUP_DIRECT_URL is unset."
          exit 1

  restore-test:
    name: Prove the backup restores (weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * 1'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check for a backup configuration
        id: guard
        run: |
          if [ -z "${{ secrets.BACKUP_DIRECT_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 18 server + client
        if: steps.guard.outputs.configured == 'true'
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-18 age
          echo "PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.configured == 'true'
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: bun install --frozen-lockfile
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.BACKUP_DIRECT_URL }}

      - name: Fetch the newest backup and decrypt it
        if: steps.guard.outputs.configured == 'true'
        working-directory: packages/database
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'auto' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          ENDPOINT=${BACKUP_S3_ENDPOINT:+--endpoint-url $BACKUP_S3_ENDPOINT}
          mkdir -p .backups
          # This step is what proves the DOWNLOAD path works too — restoring the
          # local file we just made would prove nothing about the bucket.
          LATEST=$(aws s3 ls "s3://${BACKUP_S3_BUCKET}/production/daily/" $ENDPOINT \
                   | sort | tail -1 | awk '{print $4}')
          if [ -z "$LATEST" ]; then
            echo "::error::No backup found in the bucket to restore."
            exit 1
          fi
          echo "Restoring $LATEST"
          aws s3 cp "s3://${BACKUP_S3_BUCKET}/production/daily/${LATEST}" ".backups/${LATEST}" $ENDPOINT
          printf '%s' "$AGE_IDENTITY" > /tmp/age.key
          age -d -i /tmp/age.key -o ".backups/restore.dump" ".backups/${LATEST}"
          shred -u /tmp/age.key

      - name: Restore into a throwaway server and verify
        if: steps.guard.outputs.configured == 'true'
        working-directory: packages/database
        run: bun run db:restore-test .backups/restore.dump

      - name: Shred the working copy
        if: always() && steps.guard.outputs.configured == 'true'
        working-directory: packages/database
        run: rm -rf .backups
